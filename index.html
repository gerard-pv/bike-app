<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Giant TCR Tracker</title>

  <!-- iOS PWA Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TCR Service">
  <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/180/ffffff/bicycle.png">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --ok: #22c55e;
      --warn: #eab308;
      --alert: #ef4444;
      --line: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      padding: 20px 0 12px 0;
      border-bottom: 1px solid var(--line);
      margin-bottom: 16px;
    }

    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    p.subtitle { margin: 4px 0 0 0; color: var(--text-sub); font-size: 13px; }

    .add-ride-box {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 16px;
      flex: 1;
    }

    button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    button.secondary {
      background: var(--line);
      color: var(--text);
      font-size: 12px;
      padding: 6px 12px;
    }

    .visual-card {
      background: linear-gradient(160deg, #1e293b 20%, #162033 100%);
      border: 1px solid #263448;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0 0 8px 0;
      font-size: 15px;
      font-weight: 700;
    }

    .section-subtitle {
      margin: 0 0 12px 0;
      color: var(--text-sub);
      font-size: 12px;
    }

    .bike-canvas {
      position: relative;
      width: 100%;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #2d3c51;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .bike-svg {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0.95;
    }

    .part-pin {
      position: absolute;
      width: 120px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #2f4158;
      border-radius: 8px;
      padding: 6px;
      font-size: 10px;
      backdrop-filter: blur(2px);
      transform: translate(-50%, -50%);
    }

    .part-pin-title {
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      align-items: center;
    }

    .part-pin-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .part-pin-meta {
      font-size: 9px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .progress-bar {
      height: 6px;
      background: var(--line);
      border-radius: 3px;
      overflow: hidden;
      margin: 10px 0 6px 0;
    }

    .progress-fill { height: 100%; transition: width 0.3s ease; }

    .progress-mini {
      height: 4px;
      margin: 0;
      border-radius: 2px;
    }

    .component-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .card-title { font-weight: 600; font-size: 15px; }
    .card-model { color: var(--text-sub); font-size: 12px; margin-bottom: 8px; }

    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-ok { background: rgba(34, 197, 94, 0.2); color: var(--ok); }
    .status-warn { background: rgba(234, 179, 8, 0.2); color: var(--warn); }
    .status-alert { background: rgba(239, 68, 68, 0.2); color: var(--alert); }

    .card-stats {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
    }

    .actions { margin-top: 10px; display: flex; justify-content: flex-end; }
  </style>
</head>
<body>

  <header>
    <h1>Giant TCR Service Tracker</h1>
    <p class="subtitle">Shimano Ultegra R8000 & SLR 1 Disc Spec</p>
  </header>

  <section class="add-ride-box">
    <input type="number" id="rideDistance" placeholder="Log ride distance (km)">
    <button onclick="addRide()">Log Ride</button>
  </section>

  <section class="visual-card">
    <h2 class="section-title">Bike Health View</h2>
    <p class="section-subtitle">Quick visual of key systems and their service status.</p>
    <div class="bike-canvas" id="bikeStatusVisual">
      <svg class="bike-svg" viewBox="0 0 900 420" aria-hidden="true">
        <circle cx="220" cy="300" r="120" fill="none" stroke="#405469" stroke-width="14"/>
        <circle cx="680" cy="300" r="120" fill="none" stroke="#405469" stroke-width="14"/>
        <line x1="220" y1="300" x2="380" y2="170" stroke="#7dd3fc" stroke-width="12" stroke-linecap="round"/>
        <line x1="380" y1="170" x2="500" y2="300" stroke="#7dd3fc" stroke-width="12" stroke-linecap="round"/>
        <line x1="500" y1="300" x2="220" y2="300" stroke="#7dd3fc" stroke-width="12" stroke-linecap="round"/>
        <line x1="500" y1="300" x2="680" y2="300" stroke="#7dd3fc" stroke-width="12" stroke-linecap="round"/>
        <line x1="380" y1="170" x2="600" y2="170" stroke="#7dd3fc" stroke-width="12" stroke-linecap="round"/>
        <line x1="600" y1="170" x2="680" y2="300" stroke="#7dd3fc" stroke-width="12" stroke-linecap="round"/>
        <line x1="600" y1="170" x2="620" y2="120" stroke="#9ca3af" stroke-width="10" stroke-linecap="round"/>
        <line x1="590" y1="116" x2="665" y2="116" stroke="#9ca3af" stroke-width="10" stroke-linecap="round"/>
        <line x1="390" y1="170" x2="345" y2="120" stroke="#9ca3af" stroke-width="10" stroke-linecap="round"/>
        <line x1="320" y1="120" x2="390" y2="120" stroke="#9ca3af" stroke-width="10" stroke-linecap="round"/>
        <circle cx="500" cy="300" r="26" fill="#60a5fa"/>
      </svg>
    </div>
  </section>

  <div id="componentList"></div>

  <script>
    // Custom Data Model matching Giant TCR Advanced Pro Team Disc
    const defaultComponents = [
      { id: 'chain-lube', name: 'Chain Degrease & Lube', model: 'KMC X11SL-1', type: 'km', current: 0, limit: 250 },
      { id: 'power-pro', name: 'Power Meter Charge', model: 'Giant PowerPro Dual', type: 'km', current: 0, limit: 1000 },
      { id: 'sealant', name: 'Tubeless Sealant Refresh', model: 'Giant Gavia Course AC 1', type: 'days', lastDate: Date.now(), limitDays: 120 },
      { id: 'chain-wear', name: 'Chain Wear Check / Replace', model: 'KMC X11SL-1 (11s)', type: 'km', current: 0, limit: 3500 },
      { id: 'brake-pads', name: 'Brake Pads Check', model: 'Shimano Ultegra BR-R8070', type: 'km', current: 0, limit: 4000 },
      { id: 'tires', name: 'Tire Wear Inspection', model: 'Giant Gavia Course AC 1 (700x25/28c)', type: 'km', current: 0, limit: 4500 },
      { id: 'brake-rotors', name: 'Brake Rotor Thickness Check', model: 'Shimano SM-RT800 (160/140mm)', type: 'km', current: 0, limit: 8000 },
      { id: 'hub-service', name: 'Wheel Bearing & Ratchet Lube', model: 'Giant SLR-1 (DT Swiss 360)', type: 'km', current: 0, limit: 8000 },
      { id: 'cassette', name: 'Cassette Wear Inspection', model: 'Shimano Ultegra CS-R8000 (11-30T)', type: 'km', current: 0, limit: 10000 },
      { id: 'bottom-bracket', name: 'Bottom Bracket Inspection', model: 'Shimano SM-BB72-41B PressFit', type: 'km', current: 0, limit: 10000 },
      { id: 'brake-flush', name: 'Hydraulic Brake Fluid Bleed', model: 'Shimano Mineral Oil', type: 'days', lastDate: Date.now(), limitDays: 365 }
    ];

    const partVisualConfig = [
      { id: 'drivetrain', label: 'Drivetrain', x: 52, y: 64, parts: ['chain-lube', 'chain-wear', 'cassette', 'bottom-bracket'] },
      { id: 'front-wheel', label: 'Front Wheel', x: 23, y: 74, parts: ['tires', 'sealant', 'hub-service'] },
      { id: 'rear-wheel', label: 'Rear Wheel', x: 78, y: 74, parts: ['tires', 'sealant', 'hub-service'] },
      { id: 'brakes', label: 'Brakes', x: 70, y: 42, parts: ['brake-pads', 'brake-rotors', 'brake-flush'] },
      { id: 'cockpit', label: 'Cockpit & Power', x: 40, y: 40, parts: ['power-pro'] }
    ];

    function getComponents() {
      const stored = localStorage.getItem('tcr_components_v2');
      return stored ? JSON.parse(stored) : defaultComponents;
    }

    function saveComponents(data) {
      localStorage.setItem('tcr_components_v2', JSON.stringify(data));
      render();
    }

    function addRide() {
      const input = document.getElementById('rideDistance');
      const km = parseFloat(input.value);
      if (isNaN(km) || km <= 0) return;

      const components = getComponents();
      components.forEach(c => {
        if (c.type === 'km') c.current += km;
      });
      saveComponents(components);
      input.value = '';
    }

    function resetComponent(id) {
      if (!confirm('Reset service counter for this item?')) return;
      const components = getComponents();
      const item = components.find(c => c.id === id);
      if (item) {
        if (item.type === 'km') item.current = 0;
        if (item.type === 'days') item.lastDate = Date.now();
      }
      saveComponents(components);
    }

    function getComponentUsage(item) {
      let pct = 0;
      let statText = '';

      if (item.type === 'km') {
        pct = Math.min(Math.round((item.current / item.limit) * 100), 100);
        statText = `${Math.round(item.current)} / ${item.limit} km`;
      } else if (item.type === 'days') {
        const lastDate = item.lastDate || Date.now();
        const daysElapsed = Math.floor((Date.now() - lastDate) / (1000 * 60 * 60 * 24));
        pct = Math.min(Math.round((daysElapsed / item.limitDays) * 100), 100);
        statText = `${daysElapsed} / ${item.limitDays} days`;
      }

      let statusClass = 'status-ok';
      let statusText = 'OK';
      let barColor = 'var(--ok)';

      if (pct >= 100) {
        statusClass = 'status-alert';
        statusText = 'Due';
        barColor = 'var(--alert)';
      } else if (pct >= 80) {
        statusClass = 'status-warn';
        statusText = 'Soon';
        barColor = 'var(--warn)';
      }

      return { pct, statText, statusClass, statusText, barColor };
    }

    function renderPartVisual(components) {
      const bikeVisual = document.getElementById('bikeStatusVisual');
      bikeVisual.querySelectorAll('.part-pin').forEach(pin => pin.remove());

      const componentsById = Object.fromEntries(components.map(c => [c.id, c]));

      partVisualConfig.forEach(group => {
        const groupItems = group.parts.map(id => componentsById[id]).filter(Boolean);
        if (groupItems.length === 0) return;

        const usages = groupItems.map(getComponentUsage);
        const maxUsage = usages.reduce((highest, usage) => Math.max(highest, usage.pct), 0);

        let statusClass = 'status-ok';
        let barColor = 'var(--ok)';
        let statusText = 'OK';

        if (maxUsage >= 100) {
          statusClass = 'status-alert';
          barColor = 'var(--alert)';
          statusText = 'Due';
        } else if (maxUsage >= 80) {
          statusClass = 'status-warn';
          barColor = 'var(--warn)';
          statusText = 'Soon';
        }

        const pin = document.createElement('div');
        pin.className = 'part-pin';
        pin.style.left = `${group.x}%`;
        pin.style.top = `${group.y}%`;
        pin.innerHTML = `
          <div class="part-pin-title">
            <span class="part-pin-label">${group.label}</span>
            <span class="status-badge ${statusClass}">${statusText}</span>
          </div>
          <div class="progress-bar progress-mini">
            <div class="progress-fill" style="width: ${maxUsage}%; background: ${barColor};"></div>
          </div>
          <div class="part-pin-meta">${maxUsage}% max usage</div>
        `;

        bikeVisual.appendChild(pin);
      });
    }

    function render() {
      const components = getComponents();
      const container = document.getElementById('componentList');
      container.innerHTML = '';

      renderPartVisual(components);

      components.forEach(item => {
        const { pct, statText, statusClass, statusText, barColor } = getComponentUsage(item);

        container.innerHTML += `
          <div class="component-card">
            <div class="card-header">
              <div>
                <div class="card-title">${item.name}</div>
                <div class="card-model">${item.model}</div>
              </div>
              <span class="status-badge ${statusClass}">${statusText}</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${pct}%; background: ${barColor};"></div>
            </div>
            <div class="card-stats">
              <span>${statText}</span>
              <span>${pct}% used</span>
            </div>
            <div class="actions">
              <button class="secondary" onclick="resetComponent('${item.id}')">Mark Serviced</button>
            </div>
          </div>
        `;
      });
    }

    render();
  </script>
</body>
</html>
